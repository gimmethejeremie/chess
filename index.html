<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chess Playground</title>
    <meta name="description" content="Personal chess playground for standard chess, sandbox experiments, and multiplayer matches." />
    <script>
      (function() {
        try {
          var prefix = 'chess_playground_';
          var stored = localStorage.getItem(prefix + 'theme');
          var theme = stored ? JSON.parse(stored) : null;
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- App Shell rendered dynamically via src/main.js -->
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
